openapi: 3.0.3
info:
  title: Heuristic Test Wizard API
  version: 1.0.0
  description: Initial REST API scaffold with Express, JWT, and MongoDB.
servers:
  - url: http://localhost:3000
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Heuristics
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check API status
      responses:
        "200":
          description: API healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (legacy alias; prefer /api/users/register)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPayload"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictMessage"
  /api/users/register:
    post:
      tags: [Users]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPayload"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictMessage"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and get JWT
      description: Implements SCRUM-3 (active users only; generic invalid-credentials message).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPayload"
      responses:
        "200":
          description: Login success — valid JWT access token for active users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccess"
        "400":
          description: Validation errors when required fields are missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Wrong e-mail/password combination (generic message).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: Credenciais inválidas.
        "403":
          description: Account exists but is not active (correct password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: O usuário não está ativo.
  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
        "401":
          description: Unauthorized
  /api/heuristics:
    post:
      tags: [Heuristics]
      summary: Cadastrar heurística (usuário autenticado)
      description: Implements SCRUM-2 — título e descrição obrigatórios; título único por usuário; registra criador e data/hora.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeuristicCreatePayload"
      responses:
        "201":
          description: Heurística criada com metadados de autoria.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeuristicPublic"
        "400":
          description: Erros de validação detalhados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Sem token Bearer válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "409":
          description: Conflito — já existe heurística com o mesmo título para o usuário.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictMessage"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserPublic:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        active:
          type: boolean
      required: [id, name, email, active]
    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required: [field, message]
      required: [errors]
    ConflictMessage:
      type: object
      properties:
        message:
          type: string
          example: O e-mail informado já está em uso.
      required: [message]
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    LoginSuccess:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
          required: [id, name, email]
      required: [token, user]
    RegisterPayload:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Julio
        email:
          type: string
          format: email
          example: julio@example.com
        password:
          type: string
          format: password
          example: "123456"
    LoginPayload:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: julio@example.com
        password:
          type: string
          format: password
          example: "123456"
    HeuristicCreatePayload:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          example: Visibilidade do status do sistema
        description:
          type: string
          example: O sistema deve manter o usuário informado sobre o que está acontecendo em tempo hábil.
    HeuristicPublic:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        createdBy:
          type: string
          description: ID do usuário criador (ObjectId como string).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, title, description, createdBy, createdAt, updatedAt]
