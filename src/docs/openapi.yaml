openapi: 3.0.3
info:
  title: Heuristic Test Wizard API
  version: 1.0.0
  description: Initial REST API scaffold with Express, JWT, and MongoDB.
servers:
  - url: http://localhost:3000
tags:
  - name: Health
  - name: Auth
  - name: Users
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check API status
      responses:
        "200":
          description: API healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPayload"
      responses:
        "201":
          description: User created
        "409":
          description: Email already in use
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and get JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPayload"
      responses:
        "200":
          description: Login success
        "401":
          description: Invalid credentials
  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
        "401":
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterPayload:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Julio
        email:
          type: string
          format: email
          example: julio@example.com
        password:
          type: string
          format: password
          example: "123456"
    LoginPayload:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: julio@example.com
        password:
          type: string
          format: password
          example: "123456"
